services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentryx
      POSTGRES_USER: sentryx
      POSTGRES_PASSWORD: sentryx-dev-only
    ports:
      - "${SENTRYX_POSTGRES_PORT:-5432}:5432"
    volumes:
      - sentryx-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentryx -d sentryx"]
      interval: 5s
      timeout: 3s
      retries: 10

  blob-init:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh", "-lc"]
    command: ["mkdir -p /var/lib/sentryx/blobs && chown -R sentryx:sentryx /var/lib/sentryx/blobs"]
    user: "0:0"
    volumes:
      - sentryx-blobs:/var/lib/sentryx/blobs

  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/sentryx-server", "-addr", ":8080"]
    environment:
      SENTRYX_DATABASE_URL: postgres://sentryx:sentryx-dev-only@postgres:5432/sentryx?sslmode=disable
      SENTRYX_BLOB_BACKEND: ${SENTRYX_BLOB_BACKEND:-database}
      SENTRYX_BLOB_DIR: ${SENTRYX_BLOB_DIR:-/var/lib/sentryx/blobs}
      SENTRYX_S3_ENDPOINT: ${SENTRYX_S3_ENDPOINT:-}
      SENTRYX_S3_ACCESS_KEY: ${SENTRYX_S3_ACCESS_KEY:-}
      SENTRYX_S3_SECRET_KEY: ${SENTRYX_S3_SECRET_KEY:-}
      SENTRYX_S3_REGION: ${SENTRYX_S3_REGION:-us-east-1}
      SENTRYX_S3_BUCKET: ${SENTRYX_S3_BUCKET:-sentryx}
      SENTRYX_S3_PREFIX: ${SENTRYX_S3_PREFIX:-sentryx}
      SENTRYX_S3_SECURE: ${SENTRYX_S3_SECURE:-true}
      SENTRYX_PROJECT_KEYS: ${SENTRYX_PROJECT_KEYS:-}
      SENTRYX_ARTIFACT_TOKEN: ${SENTRYX_ARTIFACT_TOKEN:-}
      SENTRYX_API_TOKENS: ${SENTRYX_API_TOKENS:-}
      SENTRYX_CURRENT_USER_ID: ${SENTRYX_CURRENT_USER_ID:-1}
      SENTRYX_RATE_LIMIT_PER_MINUTE: ${SENTRYX_RATE_LIMIT_PER_MINUTE:-}
      SENTRYX_PII_ENABLED: ${SENTRYX_PII_ENABLED:-true}
      SENTRYX_PII_SCRUB_DEFAULTS: ${SENTRYX_PII_SCRUB_DEFAULTS:-true}
      SENTRYX_PII_SCRUB_IP_ADDRESSES: ${SENTRYX_PII_SCRUB_IP_ADDRESSES:-true}
      SENTRYX_PII_SENSITIVE_FIELDS: ${SENTRYX_PII_SENSITIVE_FIELDS:-}
      SENTRYX_PII_SAFE_FIELDS: ${SENTRYX_PII_SAFE_FIELDS:-}
      SENTRYX_PII_RULES: ${SENTRYX_PII_RULES:-}
    volumes:
      - sentryx-blobs:/var/lib/sentryx/blobs
    depends_on:
      postgres:
        condition: service_healthy
      blob-init:
        condition: service_completed_successfully

  relay:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/sentryx-relay", "-addr", ":8081", "-upstream", "http://server:8080"]
    environment:
      SENTRYX_MIRROR_URL: ${SENTRYX_MIRROR_URL:-}
      SENTRYX_MIRROR_RELAY_TOKEN: ${SENTRYX_MIRROR_RELAY_TOKEN:-}
      SENTRYX_PII_ENABLED: ${SENTRYX_PII_ENABLED:-true}
      SENTRYX_PII_SCRUB_DEFAULTS: ${SENTRYX_PII_SCRUB_DEFAULTS:-true}
      SENTRYX_PII_SCRUB_IP_ADDRESSES: ${SENTRYX_PII_SCRUB_IP_ADDRESSES:-true}
      SENTRYX_PII_SENSITIVE_FIELDS: ${SENTRYX_PII_SENSITIVE_FIELDS:-}
      SENTRYX_PII_SAFE_FIELDS: ${SENTRYX_PII_SAFE_FIELDS:-}
      SENTRYX_PII_RULES: ${SENTRYX_PII_RULES:-}
    ports:
      - "8081:8081"
    depends_on:
      - server

volumes:
  sentryx-postgres:
  sentryx-blobs:
