services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentryx
      POSTGRES_USER: sentryx
      POSTGRES_PASSWORD: sentryx-dev-only
    ports:
      - "${SENTRYX_POSTGRES_PORT:-5432}:5432"
    volumes:
      - sentryx-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentryx -d sentryx"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/sentryx-server", "-addr", ":8080"]
    environment:
      SENTRYX_DATABASE_URL: postgres://sentryx:sentryx-dev-only@postgres:5432/sentryx?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  relay:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/sentryx-relay", "-addr", ":8081", "-upstream", "http://server:8080"]
    ports:
      - "8081:8081"
    depends_on:
      - server

volumes:
  sentryx-postgres:
