name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sentryx
          POSTGRES_USER: sentryx
          POSTGRES_PASSWORD: sentryx-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentryx -d sentryx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SENTRYX_TEST_DATABASE_URL: postgres://sentryx:sentryx-ci@localhost:5432/sentryx?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm ci --prefix ui
      - name: Apply PostgreSQL migrations
        run: |
          for migration in migrations/*.sql; do
            psql "$SENTRYX_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
